plugins {
    id 'java'
    id 'io.quarkus' version '3.29.2'
    id 'io.freefair.lombok' version '8.4'
}

group = 'com.example'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Align with Quarkus platform using properties read by the Quarkus Gradle plugin as well
    implementation(enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}"))
    // BOM for quarkiverse MCP extensions
    implementation(enforcedPlatform("io.quarkiverse.mcp:quarkus-mcp-server-bom:1.7.1"))

    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkiverse.mcp:quarkus-mcp-server-core'
    implementation 'io.quarkiverse.mcp:quarkus-mcp-server-sse'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.quarkiverse.mcp:quarkus-mcp-server-test'
    testImplementation 'org.assertj:assertj-core:3.27.6'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}